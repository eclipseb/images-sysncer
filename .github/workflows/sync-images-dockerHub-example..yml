name: Sync Image to Aliyun  Example

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Git pull
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2.9.1

    - name: Login to Docker Hub
      uses: docker/login-action@v2.2.0
      with:
        registry: crpi-te1k4dfwcnb8pk13.cn-shanghai.personal.cr.aliyuncs.com
        username: Quanye
        password: wangqing00
        logout: false

    - name: Use Skopeo Tools Sync Image to Docker Hub
      run: |
        skopeo copy docker://docker.io/minio/mc:RELEASE.2025-08-13T08-35-41Z-cpuv1 docker://crpi-te1k4dfwcnb8pk13.cn-shanghai.personal.cr.aliyuncs.com/zhongchunyuan/minio/mc:RELEASE.2025-08-13T08-35-41Z-cpuv1
      # skopeo copy docker://docker.io/minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1 docker://crpi-te1k4dfwcnb8pk13.cn-shanghai.personal.cr.aliyuncs.com/zhongchunyuan/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
      # 使用 skopeo 工具将镜像同步到阿里云个人仓库中，使用时请自行源和目标修改仓库名称和镜像名称 
      # skopeo copy docker://docker.io/hslr/sun-panel:1.4.0 docker://crpi-te1k4dfwcnb8pk13.cn-shanghai.personal.cr.aliyuncs.com/zhongchunyuan/sun-panel:1.4.0
